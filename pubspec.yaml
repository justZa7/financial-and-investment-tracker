name: finance_tracker
description: "Personal Finance & Investment Tracker - Catat arus kas, portofolio investasi lintas aset, dan utang-piutang."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State Management (dipilih: Provider — paling simpel & minim boilerplate)
  provider: ^6.1.2

  # Chart library
  fl_chart: ^0.68.0

  # Formatting angka & tanggal (Rupiah, tanggal Indonesia)
  intl: ^0.19.0

  # HTTP client untuk fetch harga pasar (crypto) & kurs USD-IDR dari API publik
  http: ^1.2.2

  # Generate ID unik untuk entitas lokal (transaksi, aset, utang, dll)
  uuid: ^4.4.0

  # Penyimpanan preferensi ringan (PIN hash, status lock, status onboarding)
  shared_preferences: ^2.3.2

  # Autentikasi biometrik (fingerprint/Face ID) untuk fitur kunci aplikasi
  local_auth: ^2.3.0

  # Hashing PIN sebelum disimpan (jangan pernah simpan PIN mentah)
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
